<!DOCTYPE html>
<html>
<link href="styles.css" rel="stylesheet" type="text/css">
<head>
    <title>My Budget Tracker.</title>
</head>

<body>

    <h1 class="title">My Budget Tracker.</h1>

    <p>
        Track your income and expenses in one place.
    </p>

    <section>
        <h2>Add Expense</h2>
        <input type="text" id="expense-name" placeholder="Expense Name">
        <input type="number" id="expense-amount" placeholder="Expense Amount">
        <input type="text" id="expense-category" placeholder="Expense Category">
    </section>
    <section>
      <h2>Your Expenses</h2>
     
      <input placeholder="No expenses yet." >
    </section>

</body>

</html>
